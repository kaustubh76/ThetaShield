<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><style>text{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#e2e8f0}.title{font-size:25px;font-weight:700}.axis{stroke:#94a3b8;stroke-width:1.5}.grid{stroke:#334155;stroke-width:1}.axislabel{font-size:14px;font-weight:600}.tick{font-size:11px}.annotation,.legend,.label{font-size:11px}.note{font-size:12px;fill:#94a3b8}.decision{font-size:16px;font-weight:650}.evidence{font-size:12px;fill:#94a3b8}.status{font-size:14px;font-weight:750}.value{font-size:12px}.scenario{font-size:13px;font-weight:600}</style><rect width="100%" height="100%" fill="#0f172a"/><text x="45" y="52" class="title">Phase 6 fixed-criteria hypothesis decisions</text><rect x="55" y="105" width="990" height="62" rx="8" fill="#1e293b"/><circle cx="90" cy="136" r="14" fill="#22c55e"/><text x="120" y="132" class="decision">H1 — LP protection</text><text x="120" y="153" class="evidence">paired LP improvement 1.2254 [1.0347, 1.4160]</text><text x="1015" y="141" text-anchor="end" class="status" style="fill:#22c55e">PASS</text><rect x="55" y="187" width="990" height="62" rx="8" fill="#1e293b"/><circle cx="90" cy="218" r="14" fill="#22c55e"/><text x="120" y="214" class="decision">H2 — Benign-flow fairness</text><text x="120" y="235" class="evidence">fee excess 0.00%; FPR 0.00%</text><text x="1015" y="223" text-anchor="end" class="status" style="fill:#22c55e">PASS</text><rect x="55" y="269" width="990" height="62" rx="8" fill="#1e293b"/><circle cx="90" cy="300" r="14" fill="#22c55e"/><text x="120" y="296" class="decision">H3 — Noise robustness</text><text x="120" y="317" class="evidence">raw-minus-full FPR 23.88 pp</text><text x="1015" y="305" text-anchor="end" class="status" style="fill:#22c55e">PASS</text><rect x="55" y="351" width="990" height="62" rx="8" fill="#1e293b"/><circle cx="90" cy="382" r="14" fill="#ef4444"/><text x="120" y="378" class="decision">H4 — Detection trade-off</text><text x="120" y="399" class="evidence">rank correlation 0.000; 2 dead-band/persistence Pareto points</text><text x="1015" y="387" text-anchor="end" class="status" style="fill:#ef4444">FAIL</text><rect x="55" y="433" width="990" height="62" rx="8" fill="#1e293b"/><circle cx="90" cy="464" r="14" fill="#ef4444"/><text x="120" y="460" class="decision">H5 — Manipulation resistance</text><text x="120" y="481" class="evidence">retained toxic coverage 3.55%; FPR reduction 34.69 pp</text><text x="1015" y="469" text-anchor="end" class="status" style="fill:#ef4444">FAIL</text><rect x="55" y="515" width="990" height="62" rx="8" fill="#1e293b"/><circle cx="90" cy="546" r="14" fill="#22c55e"/><text x="120" y="542" class="decision">H6 — Directional discrimination</text><text x="120" y="563" class="evidence">directional advantage 44.33 pp; fee correlation 0.253</text><text x="1015" y="551" text-anchor="end" class="status" style="fill:#22c55e">PASS</text><text x="550" y="625" text-anchor="middle" class="note">Labels apply only to the committed synthetic experiment and are retained even when unfavorable.</text></svg>
